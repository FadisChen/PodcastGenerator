<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast 生成器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- API Key Status Section -->
        <div id="api-key-section" class="section api-key-status">
            <div id="api-key-status">
                <div class="status-display">
                    <span class="status-text" id="api-status-text">✅ API 金鑰已設定</span>
                    <button id="change-api-key" class="change-key-btn">更改</button>
                </div>
            </div>
        </div>

        <!-- Material Input Section -->
        <div class="section">
            <label for="material" class="section-label">
                📝 素材內容
            </label>
            <textarea id="material" 
                      class="textarea"
                      placeholder="請輸入您的講稿素材..."></textarea>
            
            <!-- Action Buttons -->
            <div class="button-grid">
                <button id="extract-element-btn" class="action-btn">
                    🌐 網頁擷取
                </button>
                <button id="google-search-btn" class="action-btn">
                    🔎 Google
                </button>
                <button id="tavily-search-btn" class="action-btn">
                    🔍 Tavily搜尋
                </button>
            </div>
        </div>

        <!-- Voice Settings Section -->
        <div class="section">
            <label class="section-label">
                🎯 語音設定
            </label>
            
            <!-- Speech Type Selection -->
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="speechType" value="solo" checked>
                    <span>👤 單人演講</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="speechType" value="duo">
                    <span>👥 雙人對話</span>
                </label>
            </div>

            <!-- Voice Selection -->
            <div id="voice-selection">
                <!-- Voice dropdowns will be inserted here by JS -->
            </div>
        </div>

        <!-- Style Settings -->
        <div class="section">
            <label for="style-prompt" class="section-label">
                🎨 風格提示
            </label>
            <textarea id="style-prompt" 
                      class="textarea style-textarea"
                      placeholder="請輸入風格要求...">Podcast節目，語調輕鬆自然，適合收聽</textarea>
        </div>

        <!-- Generate Script Button -->
        <button id="generate-script-btn" class="main-btn generate-btn">
            <span class="loading-spinner hidden" id="script-spinner"></span>
            <span class="btn-text">✨ 生成講稿</span>
        </button>

        <!-- Script Editor -->
        <div class="section script-section">
            <div class="section-header">
                <label class="section-label">📄 講稿編輯</label>
                <span class="word-count" id="word-count">字數: 0</span>
            </div>
            <textarea id="script-content" 
                      class="textarea script-textarea"
                      placeholder="講稿內容將顯示在這裡，您可以直接編輯..."></textarea>
            
            <!-- Script Enhancement Buttons -->
            <div id="script-enhancement-section" class="enhancement-section hidden">
                <div class="enhancement-label">✨ 講稿強化</div>
                <div class="enhancement-buttons">
                    <button id="enhance-depth-btn" class="enhancement-btn" title="增加內容深度和細節">
                        🎯 增加深度
                    </button>
                    <button id="enhance-simplify-btn" class="enhancement-btn" title="精簡內容，保留重點">
                        ✂️ 精簡一點
                    </button>
                    <button id="enhance-tone-btn" class="enhancement-btn" title="調整語調，更加生動有趣">
                        🎭 調整語調
                    </button>
                    <button id="enhance-quality-btn" class="enhancement-btn" title="提升整體質感和專業度">
                        💎 提升質量
                    </button>
                    <button id="enhance-structure-btn" class="enhancement-btn" title="重新組織結構，更加條理清晰">
                        📋 優化結構
                    </button>
                    <button id="enhance-engagement-btn" class="enhancement-btn" title="增加互動性和吸引力">
                        🔥 增強吸引力
                    </button>
                </div>
            </div>
        </div>

        <!-- Generate Audio Button -->
        <button id="generate-audio-btn" class="main-btn audio-btn">
            <span class="loading-spinner hidden" id="audio-spinner"></span>
            <span class="btn-text">🔊 生成音檔</span>
        </button>

        <!-- Audio Player Section -->
        <div id="audio-section" class="section audio-section hidden">
            <div class="section-label">🎵 音檔播放</div>
            <audio controls id="audio-player" class="audio-player"></audio>
            <button id="download-audio-btn" class="main-btn download-btn">
                📥 下載音檔
            </button>
        </div>

        <!-- Image Generation Section -->
        <div class="section">
            <div class="section-label">🎨 封面圖片生成</div>
            
            <!-- Prompt Input -->
            <div class="input-group">
                <textarea id="image-prompt" 
                          class="textarea" 
                          rows="3"
                          placeholder="請輸入圖片描述，或使用下方按鈕根據素材或講稿自動生成"></textarea>
                <div class="button-grid" style="margin-top: 8px;">
                    <button id="auto-generate-prompt-btn" class="action-btn">
                        🤖 自動生成
                    </button>
                </div>
            </div>
        </div>
            <!-- Generate Button -->
            <button id="generate-image-btn" class="main-btn image-btn">
                <span class="loading-spinner hidden" id="image-spinner"></span>
                <span class="btn-text">🎨 生成封面圖片</span>
            </button>

            <!-- Generated Image Display -->
            <div id="generated-image-area" class="section hidden">
                <div class="section-label">🖼️ 生成結果</div>
                <div class="image-display">
                    <img id="generated-image" src="" alt="Generated Cover" class="generated-image">
                    <button id="download-image-btn" class="main-btn download-btn" style="margin-top: 12px;">
                        📥 下載封面圖片
                    </button>
                </div>
            </div>
        
    </div>

    <!-- Modals -->
    <!-- Google Search Modal -->
    <div id="google-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">🔎 Google 搜尋</h3>
            <textarea id="google-query" 
                      class="textarea modal-textarea" 
                      placeholder="請輸入要搜尋的問題或關鍵字..."></textarea>
            <div class="modal-buttons">
                <button id="cancel-google" class="btn-secondary">
                    取消
                </button>
                <button id="confirm-google" class="btn-primary">
                    搜尋
                </button>
            </div>
        </div>
    </div>

    <!-- Tavily Search Modal -->
    <div id="tavily-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title">🔍 Tavily 搜尋</h3>
            <input type="text" 
                   id="tavily-query" 
                   class="input" 
                   placeholder="請輸入搜尋關鍵字...">
            <div class="checkbox-group">
                <input type="checkbox" id="deep-search">
                <label for="deep-search">深度搜索</label>
            </div>
            <div class="modal-buttons">
                <button id="cancel-tavily" class="btn-secondary">
                    取消
                </button>
                <button id="confirm-tavily" class="btn-primary">
                    搜尋
                </button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal alert-modal hidden">
        <div id="alert-content" class="alert-content">
            <!-- Alert message will be inserted here by JS -->
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
